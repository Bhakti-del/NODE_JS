```html
<!DOCTYPE html>
<html>

<head>
    <title>Login - E-Book Store</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar bg-dark">
    <div class="container">
        <a class="navbar-brand text-white" href="index.html">
            📚 E-Book Store
        </a>

        <div>
            <a class="text-white me-3" href="index.html">Home</a>
            <a class="text-white me-3" href="catalog.html">Catalog</a>
            <a class="text-white me-3" href="login.html">Login</a>
            <a class="text-white me-3" href="register.html">Register</a>
            <a class="text-white" href="cart.html">Cart</a>
        </div>
    </div>
</nav>


<!-- Login Form -->
<div class="container mt-5">

    <div class="card mx-auto p-4" style="max-width:400px">

        <h2 class="text-center">Login</h2>

        <form>

            <label>Email</label>
            <input type="email"
                   class="form-control mb-3"
                   placeholder="Enter email"
                   required>

            <label>Password</label>
            <input type="password"
                   class="form-control mb-3"
                   placeholder="Enter password"
                   required>

            <div class="mb-3">
                <input type="checkbox">
                Remember Me
            </div>

            <button class="btn btn-primary w-100">
                Login
            </button>

        </form>

        <p class="text-center mt-3">
            New user?
            <a href="register.html">Create an account</a>
        </p>

    </div>

</div>


<!-- Footer -->
<footer class="bg-dark text-white text-center p-3 mt-5">
    © 2026 E-Book Store
</footer>

</body>
</html>
